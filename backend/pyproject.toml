[project]
name = "gojob-backend"
version = "0.0.0"  # the app version lives in ../package.json
description = "Go Job backend: FastAPI service behind the Next.js interface"
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "python-multipart",
  "httpx",
  "mammoth",
  "pypdf",
  "python-docx",
  "lxml",
  "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["gojob"]
