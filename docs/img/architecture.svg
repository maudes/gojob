<g class="teal"><rect x="40" y="480" width="600" height="84" rx="8"/>
<line class="div" x1="245" y1="490" x2="245" y2="554"/>
<text class="th" x="142" y="498">1 · Layout lock</text>
<text class="ts" x="142" y="518">Resume changes only:</text>
<text class="ts" x="142" y="535">name, sections, employers,</text>
<text class="ts" x="142" y="552">titles, dates stay locked</text>
<text class="th" x="442" y="498">2 · Audit gate (with_audit)</text>
<text class="ts" x="442" y="518">Five Haiku auditors + word-for-word quote check</text>
<text class="ts" x="442" y="535">Fails: the same role rewrites once</text>
<text class="ts" x="442" y="552">(search roles are audited only)</text></g>

