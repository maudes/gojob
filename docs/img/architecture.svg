<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img" aria-labelledby="t d">
<title id="t">GoJob system architecture</title>
<desc id="d">Five layers from top to bottom: Next.js screens, FastAPI backend, four AI roles, an audit gate, and local data files.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .gray rect { fill: #F1EFE8; stroke: #888780; }
  .gray .th { fill: #2C2C2A; } .gray .ts { fill: #5F5E5A; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  rect { stroke-width: 0.75; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="510" fill="#ffffff" stroke="none"/>

<g class="gray"><rect x="140" y="20" width="400" height="56" rx="8"/>
<text class="th" x="340" y="40">Next.js single page</text>
<text class="ts" x="340" y="58">Five tabs · draws screens, forwards /api/*</text></g>
<line class="arr" x1="340" y1="76" x2="340" y2="102" marker-end="url(#arrow)"/>

<g class="gray"><rect x="140" y="104" width="400" height="56" rx="8"/>
<text class="th" x="340" y="124">FastAPI backend</text>
<text class="ts" x="340" y="142">Validates requests · routes · reads and writes data</text></g>

<path class="arr" d="M340 160V187"/>
<path class="arr" d="M107 187H572"/>
<line class="arr" x1="107" y1="187" x2="107" y2="212" marker-end="url(#arrow)"/>
<line class="arr" x1="262" y1="187" x2="262" y2="212" marker-end="url(#arrow)"/>
<line class="arr" x1="417" y1="187" x2="417" y2="212" marker-end="url(#arrow)"/>
<line class="arr" x1="572" y1="187" x2="572" y2="212" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="214" width="135" height="72" rx="8"/>
<text class="th" x="107" y="234">Writer</text><text class="ts" x="107" y="254">Analysis, tuning</text><text class="ts" x="107" y="271">Letter, questions</text></g>
<g class="purple"><rect x="195" y="214" width="135" height="72" rx="8"/>
<text class="th" x="262" y="234">Review panel</text><text class="ts" x="262" y="254">Three reviewers</text><text class="ts" x="262" y="271">score in parallel</text></g>
<g class="purple"><rect x="350" y="214" width="135" height="72" rx="8"/>
<text class="th" x="417" y="234">Search agent</text><text class="ts" x="417" y="254">Jobs · people</text><text class="ts" x="417" y="271">Company research</text></g>
<g class="purple"><rect x="505" y="214" width="135" height="72" rx="8"/>
<text class="th" x="572" y="234">Interview coach</text><text class="ts" x="572" y="254">Questions</text><text class="ts" x="572" y="271">Feedback · report</text></g>

<line class="arr" x1="107" y1="286" x2="107" y2="318" marker-end="url(#arrow)"/>
<line class="arr" x1="262" y1="286" x2="262" y2="318" marker-end="url(#arrow)"/>
<line class="arr" x1="417" y1="286" x2="417" y2="318" marker-end="url(#arrow)"/>
<line class="arr" x1="572" y1="286" x2="572" y2="318" marker-end="url(#arrow)"/>

<g class="teal"><rect x="40" y="320" width="600" height="72" rx="8"/>
<text class="th" x="340" y="340">Audit gate (withAudit)</text>
<text class="ts" x="340" y="360">Five Haiku auditors in parallel + word-for-word quote check</text>
<text class="ts" x="340" y="377">On failure: back to the same role once (search roles are audited only)</text></g>

<line class="arr" x1="215" y1="392" x2="215" y2="424" marker-end="url(#arrow)"/>
<line class="arr" x1="465" y1="392" x2="465" y2="424" marker-end="url(#arrow)"/>

<g class="gray"><rect x="100" y="426" width="230" height="56" rx="8"/>
<text class="th" x="215" y="446">data/db.json</text><text class="ts" x="215" y="464">State and results · versioned</text></g>
<g class="gray"><rect x="350" y="426" width="230" height="56" rx="8"/>
<text class="th" x="465" y="446">data/files/</text><text class="ts" x="465" y="464">Original resume .docx files</text></g>
</svg>
