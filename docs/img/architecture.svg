<text class="th" x="262" y="304">Review panel</text><text class="ts" x="262" y="324">Three reviewers</text><text class="ts" x="262" y="341">score in parallel</text></g>
<g class="purple"><rect x="350" y="284" width="135" height="72" rx="8"/>
<text class="th" x="417" y="304">Search agent</text><text class="ts" x="417" y="324">Jobs · people</text><text class="ts" x="417" y="341">Company research</text></g>
<g class="purple"><rect x="505" y="284" width="135" height="72" rx="8"/>
<text class="th" x="572" y="304">Interview coach</text><text class="ts" x="572" y="324">Questions</text><text class="ts" x="572" y="341">Feedback · report</text></g>

