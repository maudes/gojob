name: Security

# Dependency vulnerability scan. Runs on every push and pull request, and weekly,
# because new advisories appear for versions that were clean when they were committed.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Audit the lockfile as committed. Fails on any known advisory.
      - run: npm audit --audit-level=low

  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Export the exact versions pinned in uv.lock, then check them against PyPI advisories.
      - name: Export locked requirements
        working-directory: backend
        run: uv export --frozen --no-hashes --no-emit-project -o ${{ runner.temp }}/requirements.txt
      - name: Audit
        run: uvx pip-audit -r ${{ runner.temp }}/requirements.txt --no-deps --disable-pip
